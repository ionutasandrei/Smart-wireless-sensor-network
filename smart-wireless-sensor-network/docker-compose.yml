services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
  consumer:
    build: .
    command: python -u app/consumer.py
    environment:
      MQTT_HOST: mqtt
    volumes:
      - db:/data
    depends_on:
      - mqtt
    restart: unless-stopped
  replay:
    build: .
    command: python -u app/replay.py
    environment:
      MQTT_HOST: mqtt
    depends_on:
      - mqtt
    restart: unless-stopped
  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - db:/data
    depends_on:
      - consumer
volumes:
  db:
